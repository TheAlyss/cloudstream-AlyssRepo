name: Build Plugins

permissions:
  contents: write

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          BUILD_SUCCESS=false
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ===" | tee -a build_output.log
            if ./gradlew make makePluginsJson --stacktrace >> build_output.log 2>&1; then
              BUILD_SUCCESS=true
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed (likely Jitpack transient issue), retrying in 30s..." | tee -a build_output.log
              # Clear Gradle caches for failed SNAPSHOT resolution
              find ~/.gradle/caches -name "*.lock" -delete 2>/dev/null || true
              rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.recloudstream 2>/dev/null || true
              sleep 30
            fi
          done
          if [ "$BUILD_SUCCESS" = false ]; then
            echo "BUILD FAILED after 3 attempts" >> build_output.log
            mkdir -p ../builds
            cp build_output.log ../builds/
            cd ../builds
            if [ ! -d ".git" ]; then
              git init -b builds
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B builds
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git add build_output.log
            git commit -m "Capture build failure log [skip ci]" || true
            git push origin builds
            exit 1
          fi
          mkdir -p ../builds
          cp repo.json ../builds/ 2>/dev/null || true
          cp build/*.cs3 ../builds/ 2>/dev/null || true
          cp */build/*.cs3 ../builds/ 2>/dev/null || true
          cp build/plugins.json ../builds/ 2>/dev/null || true

      - name: Deploy to Builds Branch
        run: |
          cd builds
          if [ ! -d ".git" ]; then
            git init -b builds
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B builds
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add .
          git commit -m "Update CloudStream plugins and plugins.json [skip ci]" || exit 0
          git push origin builds
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/plugins.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/YlnimeProvider.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/FilmapikProvider.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/MovieboxProvider.cs3" || true
