name: Build Plugins

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          mkdir -p ../builds
          cp build/*.cs3 ../builds/ 2>/dev/null || true
          cp */build/*.cs3 ../builds/ 2>/dev/null || true
          cp build/plugins.json ../builds/ 2>/dev/null || true

      - name: Deploy to Builds Branch
        run: |
          cd builds
          if [ ! -d ".git" ]; then
            git init -b builds
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B builds
          git add .
          git commit -m "Update CloudStream plugins and plugins.json [skip ci]" || exit 0
          git push origin builds
